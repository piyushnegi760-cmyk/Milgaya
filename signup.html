<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Milgaya</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =================================
       MILGAYA CREATE ACCOUNT PAGE
       ================================= */

    .signup-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
      background: #f8fafc;
    }

    /* ==============================
       LOST & FOUND BACKGROUND
       ============================== */

    .lost-found-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .lost-found-bg::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      left: -180px;
      top: -180px;
      border-radius: 50%;
      background: rgba(73, 108, 255, 0.08);
      filter: blur(25px);
    }

    .lost-found-bg::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      right: -170px;
      bottom: -160px;
      border-radius: 50%;
      background: rgba(68, 190, 139, 0.07);
      filter: blur(25px);
    }

    /* Route */

    .bg-route {
      position: absolute;
      width: 500px;
      height: 180px;
      border: 1.5px dashed rgba(73, 108, 255, 0.13);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .route-1 {
      left: -120px;
      top: 30%;
    }

    .route-2 {
      right: -150px;
      bottom: 25%;
      transform: rotate(160deg);
    }

    /* Floating items */

    .lost-item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(73, 108, 255, 0.20);
      font-weight: 700;
      animation: itemFloat 6s ease-in-out infinite;
    }

    .item-bag {
      left: 10%;
      top: 18%;
      width: 48px;
      height: 48px;
      border: 2px solid rgba(73, 108, 255, 0.15);
      border-radius: 12px;
      font-size: 28px;
    }

    .item-key {
      right: 12%;
      top: 23%;
      font-size: 40px;
      animation-delay: 1.5s;
    }

    .item-tag {
      left: 14%;
      bottom: 18%;
      font-size: 38px;
      animation-delay: 3s;
    }

    @keyframes itemFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(4deg);
      }
    }

    /* QR scanning circles */

    .scan-ring {
      position: absolute;
      width: 70px;
      height: 70px;
      border: 1px solid rgba(73, 108, 255, 0.12);
      border-radius: 50%;
      animation: scanPulse 4s ease-in-out infinite;
    }

    .ring-1 {
      right: 18%;
      bottom: 18%;
    }

    .ring-2 {
      left: 20%;
      top: 45%;
      width: 40px;
      height: 40px;
      animation-delay: 1.5s;
    }

    @keyframes scanPulse {
      0%, 100% {
        transform: scale(1);
        opacity: .35;
      }

      50% {
        transform: scale(1.35);
        opacity: .75;
      }
    }

    /* Found */

    .found-pin {
      position: absolute;
      right: 9%;
      top: 55%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: rgba(68, 190, 139, 0.10);
      border: 1px solid rgba(68, 190, 139, 0.18);
      animation: pinFloat 5s ease-in-out infinite;
    }

    .found-pin span {
      transform: rotate(45deg);
      color: #35a978;
      font-size: 18px;
      font-weight: 800;
    }

    @keyframes pinFloat {
      0%, 100% {
        transform: rotate(-45deg) translateY(0);
      }

      50% {
        transform: rotate(-45deg) translateY(-10px);
      }
    }

    /* ==============================
       SIGNUP CONTAINER
       ============================== */

    .signup-container {
      width: 100%;
      max-width: 450px;
      position: relative;
      z-index: 5;
      animation: signupEnter .8s ease forwards;
    }

    @keyframes signupEnter {
      from {
        opacity: 0;
        transform: translateY(35px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo */

    .signup-logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .signup-logo h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #111827;
    }

    .signup-logo h1 span {
      color: #496cff;
    }

    .signup-logo p {
      margin: 7px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    /* Card */

    .signup-card {
      background: rgba(255, 255, 255, .90);
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 24px;
      padding: 34px;
      box-shadow:
        0 25px 70px rgba(31, 41, 55, .12),
        0 5px 20px rgba(73, 108, 255, .05);
      backdrop-filter: blur(18px);
      animation: cardFloat 5s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .signup-card h2 {
      margin: 0 0 7px;
      color: #111827;
      font-size: 26px;
    }

    .signup-subtitle {
      margin: 0 0 25px;
      color: #6b7280;
      font-size: 14px;
    }

    /* Form */

    .signup-form-group {
      margin-bottom: 17px;
    }

    .signup-form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .signup-input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      outline: none;
      background: #fff;
      color: #111827;
      font-size: 15px;
      box-sizing: border-box;
      transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
    }

    .signup-input:focus {
      border-color: #496cff;
      box-shadow: 0 0 0 4px rgba(73, 108, 255, .10);
      transform: translateY(-1px);
    }

    .signup-input::placeholder {
      color: #9ca3af;
    }

    /* Button */

    .signup-btn {
      width: 100%;
      height: 52px;
      margin-top: 4px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #496cff, #7057e8);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(73, 108, 255, .22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(73, 108, 255, .28);
    }

    .signup-btn:active {
      transform: translateY(0);
    }

    /* Google */

    .signup-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 23px 0;
      color: #9ca3af;
      font-size: 12px;
    }

    .signup-divider::before,
    .signup-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .google-btn {
      width: 100%;
      height: 50px;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      background: #fff;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .25s ease;
    }

    .google-btn:hover {
      background: #f9fafb;
      transform: translateY(-1px);
    }

    /* Login link */

    .login-text {
      text-align: center;
      margin: 22px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .login-text a {
      color: #496cff;
      font-weight: 700;
      text-decoration: none;
    }

    /* Mobile */

    @media (max-width: 520px) {

      .signup-page {
        padding: 20px 15px;
      }

      .signup-card {
        padding: 26px 20px;
        border-radius: 20px;
      }

      .signup-logo h1 {
        font-size: 34px;
      }

      .signup-card h2 {
        font-size: 23px;
      }

      .item-bag {
        left: 4%;
      }

      .item-key {
        right: 4%;
      }

      .item-tag {
        left: 5%;
      }

      .found-pin {
        right: 4%;
      }
    }
  </style>
</head>

<body>

  <main class="signup-page">

    <!-- Lost & Found background -->

    <div class="lost-found-bg">

      <div class="bg-route route-1"></div>
      <div class="bg-route route-2"></div>

      <div class="lost-item item-bag">
        ▱
      </div>

      <div class="lost-item item-key">
        ⌕
      </div>

      <div class="lost-item item-tag">
        ◇
      </div>

      <div class="scan-ring ring-1"></div>
      <div class="scan-ring ring-2"></div>

      <div class="found-pin">
        <span>✓</span>
      </div>

    </div>

    <!-- Signup -->

    <div class="signup-container">

      <div class="signup-logo">

        <h1>
          Mil<span>gaya</span>
        </h1>

        <p>
          Lost something? Let it find its way back.
        </p>

      </div>

      <div class="signup-card">

        <h2>
          Create Account
        </h2>

        <p class="signup-subtitle">
          Start protecting your belongings with Milgaya.
        </p>

        <form id="signupForm">

          <div class="signup-form-group">

            <label for="name">
              Full Name
            </label>

            <input
              type="text"
              id="name"
              class="signup-input"
              placeholder="Enter your full name"
              required
            >

          </div>

          <div class="signup-form-group">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              class="signup-input"
              placeholder="Enter your email"
              required
            >

          </div>

          <div class="signup-form-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              class="signup-input"
              placeholder="Create a password"
              required
            >

          </div>

          <div class="signup-form-group">

            <label for="confirmPassword">
              Confirm Password
            </label>

            <input
              type="password"
              id="confirmPassword"
              class="signup-input"
              placeholder="Confirm your password"
              required
            >

          </div>

          <button
            type="submit"
            class="signup-btn"
          >
            Create Account
          </button>

        </form>

        <div class="signup-divider">
          OR
        </div>

        <button
          type="button"
          class="google-btn"
        >
          Continue with Google
        </button>

        <p class="login-text">
          Already have an account?
          <a href="login.html">
            Sign In
          </a>
        </p>

      </div>

    </div>

  </main>

  <script src="js/auth.js"></script>

</body>
</html>
