<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Milgaya</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* ==============================
       MILGAYA LOGIN PAGE
       ============================== */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(72, 116, 255, 0.14), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(130, 80, 255, 0.12), transparent 30%),
        #f7f9fc;
    }

    /* Animated background circles */

    .login-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    .login-orb.one {
      width: 180px;
      height: 180px;
      background: rgba(75, 115, 255, 0.13);
      top: 8%;
      left: 8%;
      animation: orbFloat 7s ease-in-out infinite;
    }

    .login-orb.two {
      width: 140px;
      height: 140px;
      background: rgba(125, 85, 255, 0.10);
      bottom: 10%;
      right: 10%;
      animation: orbFloat 8s ease-in-out infinite reverse;
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(0, -25px, 0);
      }
    }

    /* Login container */

    .login-container {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
      animation: cardEnter 0.8s ease forwards;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo */

    .login-logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .login-logo h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #111827;
    }

    .login-logo h1 span {
      color: #496cff;
    }

    .login-logo p {
      margin: 7px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    /* Card */

    .login-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 34px;
      box-shadow:
        0 25px 70px rgba(31, 41, 55, 0.12),
        0 5px 20px rgba(73, 108, 255, 0.05);
      backdrop-filter: blur(18px);
      animation: cardFloat 5s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .login-card h2 {
      margin: 0 0 7px;
      color: #111827;
      font-size: 26px;
    }

    .login-subtitle {
      margin: 0 0 25px;
      color: #6b7280;
      font-size: 14px;
    }

    /* Form */

    .login-form-group {
      margin-bottom: 18px;
    }

    .login-form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .login-input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      outline: none;
      background: #ffffff;
      color: #111827;
      font-size: 15px;
      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
      box-sizing: border-box;
    }

    .login-input:focus {
      border-color: #496cff;
      box-shadow: 0 0 0 4px rgba(73, 108, 255, 0.10);
      transform: translateY(-1px);
    }

    .login-input::placeholder {
      color: #9ca3af;
    }

    /* Forgot password */

    .login-options {
      display: flex;
      justify-content: flex-end;
      margin: -5px 0 20px;
    }

    .forgot-link {
      color: #496cff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    .forgot-link:hover {
      color: #304ed4;
    }

    /* Login button */

    .login-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #496cff, #7057e8);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(73, 108, 255, 0.22);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(73, 108, 255, 0.28);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    /* Divider */

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #9ca3af;
      font-size: 12px;
    }

    .login-divider::before,
    .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    /* Google button */

    .google-btn {
      width: 100%;
      height: 50px;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      background: #ffffff;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .google-btn:hover {
      border-color: #cfd5df;
      background: #f9fafb;
      transform: translateY(-1px);
    }

    /* Signup */

    .signup-text {
      text-align: center;
      margin: 23px 0 0;
      font-size: 13px;
      color: #6b7280;
    }

    .signup-text a {
      color: #496cff;
      font-weight: 700;
      text-decoration: none;
    }

    /* Mobile */

    @media (max-width: 520px) {

      .login-page {
        padding: 20px 15px;
      }

      .login-card {
        padding: 26px 20px;
        border-radius: 20px;
      }

      .login-logo h1 {
        font-size: 34px;
      }

      .login-card h2 {
        font-size: 23px;
      }

      .login-orb.one {
        width: 120px;
        height: 120px;
      }

      .login-orb.two {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <main class="login-page">

   <div class="lost-found-bg">

  <div class="bg-route route-1"></div>
  <div class="bg-route route-2"></div>

  <div class="lost-item item-bag">▱</div>
  <div class="lost-item item-key">⌕</div>
  <div class="lost-item item-tag">◇</div>

  <div class="scan-ring ring-1"></div>
  <div class="scan-ring ring-2"></div>

  <div class="found-pin">
    <span>✓</span>
  </div>

    <div class="login-container">

      <div class="login-logo">
        <h1>Mil<span>gaya</span></h1>
        <p>Lost something? Let it find its way back.</p>
      </div>

      <div class="login-card">

        <h2>Welcome</h2>

        <p class="login-subtitle">
          Sign in to manage your Milgaya QR codes.
        </p>

        <form id="loginForm">

          <div class="login-form-group">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              class="login-input"
              placeholder="Enter your email"
              required
            >
          </div>

          <div class="login-form-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              class="login-input"
              placeholder="Enter your password"
              required
            >
          </div>

          <div class="login-options">
            <a href="forgot-password.html" class="forgot-link">
  Forgot password?
</a>
          </div>

          <button type="submit" class="login-btn">
            Sign In
          </button>

        </form>

        <div class="login-divider">
          OR
        </div>

        <button class="google-btn" type="button">
          Continue with Google
        </button>

        <p class="signup-text">
          Don't have an account?
          <a href="signup.html">Create Account</a>
        </p>

      </div>

    </div>

  </main>

  <script src="js/auth.js"></script>

</body>
</html>
