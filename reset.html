<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Milgaya — Reset Password</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="bg-slate-950 text-white min-h-screen">

  <main class="max-w-md mx-auto px-5 py-16">

    <div class="bg-white/5 border border-white/10
                rounded-3xl p-6">

      <div class="text-2xl font-black mb-8">
        Milgaya<span class="text-yellow-400">.</span>
      </div>


      <h1 class="text-3xl font-bold">
        Reset Password
      </h1>

      <p class="text-gray-400 text-sm mt-2">
        Enter your new password.
      </p>


      <input
        id="password"
        type="password"
        placeholder="New password"
        class="w-full mt-7 px-4 py-3.5 rounded-xl
               bg-slate-900 border border-white/10
               outline-none"
      >


      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        class="w-full mt-3 px-4 py-3.5 rounded-xl
               bg-slate-900 border border-white/10
               outline-none"
      >


      <button
        id="updateButton"
        onclick="updatePassword()"
        class="w-full mt-5 py-4 rounded-xl
               bg-yellow-400 text-black font-bold">

        Update Password

      </button>


      <p
        id="message"
        class="text-sm mt-5">
      </p>

    </div>

  </main>


<script>

/* SUPABASE */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_PUBLISHABLE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* UPDATE PASSWORD */

async function updatePassword() {

  const password =
    document
      .getElementById("password")
      .value;

  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;

  const message =
    document
      .getElementById("message");

  const button =
    document
      .getElementById("updateButton");


  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;

  }


  if (password !== confirmPassword) {

    message.textContent =
      "Passwords do not match.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Updating...";


  try {

    const {
      error
    } =
      await supabaseClient.auth
        .updateUser({

          password: password

        });


    if (error) {

      throw error;

    }


    message.className =
      "text-sm mt-5 text-green-400";

    message.textContent =
      "Password updated successfully.";


    setTimeout(() => {

      window.location.replace(
        "index.html"
      );

    }, 1500);

  }

  catch (error) {

    console.error(error);

    message.className =
      "text-sm mt-5 text-red-400";

    message.textContent =
      error.message;

    button.disabled = false;

    button.textContent =
      "Update Password";

  }

}

</script>

</body>

</html>
