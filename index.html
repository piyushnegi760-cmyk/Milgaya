<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Milgaya — Welcome</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background:
        radial-gradient(circle at 10% 10%, rgba(234,179,8,.18), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(37,99,235,.18), transparent 30%),
        #020617;
    }

    .glass {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(20px);
    }

    input {
      transition: .2s;
    }

    input:focus {
      box-shadow: 0 0 0 2px rgba(250,204,21,.18);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="min-h-screen text-white">

  <!-- HEADER -->
  <header class="px-5 py-5">
    <div class="max-w-md mx-auto flex items-center justify-between">

      <div class="text-2xl font-black tracking-tight">
        Milgaya<span class="text-yellow-400">.</span>
      </div>

      <span class="text-xs text-gray-500">
        Lost & Found
      </span>

    </div>
  </header>


  <!-- MAIN -->
  <main class="max-w-md mx-auto px-5 py-8">

    <section class="glass rounded-3xl p-6 shadow-2xl">

      <!-- LOGO -->
      <div class="text-center mb-7">

        <div class="w-16 h-16 mx-auto rounded-2xl
                    bg-yellow-400 text-black
                    flex items-center justify-center
                    text-3xl font-black mb-4">
          M
        </div>

        <h1 id="title"
            class="text-3xl font-bold">
          Welcome
        </h1>

        <p id="subtitle"
           class="text-gray-400 text-sm mt-2">
          Login to your Milgaya account
        </p>

      </div>


      <!-- MESSAGE -->
      <div id="message"
           class="hidden rounded-xl px-4 py-3 mb-5 text-sm">
      </div>


      <!-- EMAIL AUTH -->
      <div id="authBox">

        <!-- NAME -->
        <div id="nameContainer"
             class="hidden mb-4">

          <label class="text-sm text-gray-300">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            autocomplete="name"
            placeholder="Enter your name"
            class="w-full mt-2 px-4 py-3.5 rounded-xl
                   bg-slate-900 border border-white/10
                   outline-none"
          >

        </div>


        <!-- EMAIL -->
        <div class="mb-4">

          <label class="text-sm text-gray-300">
            Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@gmail.com"
            class="w-full mt-2 px-4 py-3.5 rounded-xl
                   bg-slate-900 border border-white/10
                   outline-none"
          >

        </div>


        <!-- PASSWORD -->
        <div class="mb-2">

          <label class="text-sm text-gray-300">
            Password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            class="w-full mt-2 px-4 py-3.5 rounded-xl
                   bg-slate-900 border border-white/10
                   outline-none"
          >

        </div>


        <!-- FORGOT PASSWORD -->
        <div id="forgotContainer"
             class="text-right mb-5">

          <button
            type="button"
            onclick="forgotPassword()"
            class="text-sm text-yellow-400 hover:underline">

            Forgot password?

          </button>

        </div>


        <!-- MAIN BUTTON -->
        <button
          id="mainButton"
          type="button"
          onclick="submitEmailAuth()"
          class="w-full py-4 rounded-xl
                 bg-yellow-400 hover:bg-yellow-300
                 text-black font-bold transition">

          Login

        </button>


        <!-- SWITCH -->
        <div class="text-center mt-5 text-sm text-gray-400">

          <span id="switchText">
            Don't have an account?
          </span>

          <button
            type="button"
            onclick="toggleSignup()"
            id="switchButton"
            class="text-yellow-400 font-semibold ml-1">

            Create Account

          </button>

        </div>

      </div>


      <!-- DIVIDER -->
      <div id="divider"
           class="flex items-center gap-3 my-6">

        <div class="flex-1 h-px bg-white/10"></div>

        <span class="text-xs text-gray-500">
          OR
        </span>

        <div class="flex-1 h-px bg-white/10"></div>

      </div>


      <!-- GOOGLE -->
      <button
        id="googleButton"
        type="button"
        onclick="googleLogin()"
        class="w-full py-3.5 rounded-xl
               bg-white text-black
               font-semibold flex items-center
               justify-center gap-3
               hover:bg-gray-100 transition">

        <span class="font-bold text-lg">G</span>

        Continue with Google

      </button>


      <!-- PHONE -->
      <button
        id="phoneButton"
        type="button"
        onclick="openPhoneLogin()"
        class="w-full mt-3 py-3.5 rounded-xl
               bg-white/5 border border-white/10
               hover:bg-white/10
               font-semibold">

        📱 Continue with Phone

      </button>


      <!-- PHONE BOX -->
      <div id="phoneBox" class="hidden mt-5">

        <label class="text-sm text-gray-300">
          Phone Number
        </label>

        <input
          id="phone"
          type="tel"
          autocomplete="tel"
          placeholder="9762463324"
          class="w-full mt-2 px-4 py-3.5 rounded-xl
                 bg-slate-900 border border-white/10
                 outline-none"
        >


        <button
          id="sendOtpButton"
          onclick="sendOTP()"
          class="w-full mt-4 py-3.5 rounded-xl
                 bg-yellow-400 text-black font-bold">

          Send OTP

        </button>


        <div id="otpBox" class="hidden">

          <input
            id="otp"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
            class="w-full mt-3 px-4 py-3.5 rounded-xl
                   bg-slate-900 border border-white/10
                   outline-none"
          >


          <button
            onclick="verifyOTP()"
            class="w-full mt-3 py-3.5 rounded-xl
                   bg-green-500 hover:bg-green-400
                   text-black font-bold">

            Verify OTP

          </button>

        </div>


        <button
          onclick="closePhoneLogin()"
          class="w-full mt-4 text-sm text-gray-400">

          ← Back to login

        </button>

      </div>

    </section>

  </main>


<script>

/* =====================================================
   1. SUPABASE CONFIG
===================================================== */

/*
   Supabase Dashboard
   → Project Settings
   → API

   Copy:
   Project URL
   Publishable Key
*/

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_PUBLISHABLE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   2. STATE
===================================================== */

let signupMode = false;


/* =====================================================
   3. ELEMENTS
===================================================== */

const title =
  document.getElementById("title");

const subtitle =
  document.getElementById("subtitle");

const nameContainer =
  document.getElementById("nameContainer");

const nameInput =
  document.getElementById("name");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const mainButton =
  document.getElementById("mainButton");

const switchText =
  document.getElementById("switchText");

const switchButton =
  document.getElementById("switchButton");

const forgotContainer =
  document.getElementById("forgotContainer");

const message =
  document.getElementById("message");


/* =====================================================
   4. MESSAGE
===================================================== */

function showMessage(text, type = "error") {

  message.textContent = text;

  message.className =
    "rounded-xl px-4 py-3 mb-5 text-sm";


  if (type === "success") {

    message.classList.add(
      "bg-green-500/10",
      "text-green-300",
      "border",
      "border-green-500/20"
    );

  } else {

    message.classList.add(
      "bg-red-500/10",
      "text-red-300",
      "border",
      "border-red-500/20"
    );

  }

}


function clearMessage() {

  message.textContent = "";

  message.className =
    "hidden rounded-xl px-4 py-3 mb-5 text-sm";

}


/* =====================================================
   5. LOGIN / SIGNUP SWITCH
===================================================== */

function toggleSignup() {

  signupMode = !signupMode;

  clearMessage();


  if (signupMode) {

    title.textContent =
      "Create Account";

    subtitle.textContent =
      "Create your Milgaya account";

    nameContainer.classList.remove("hidden");

    forgotContainer.classList.add("hidden");

    mainButton.textContent =
      "Create Account";

    switchText.textContent =
      "Already have an account?";

    switchButton.textContent =
      "Login";

  } else {

    title.textContent =
      "Welcome";

    subtitle.textContent =
      "Login to your Milgaya account";

    nameContainer.classList.add("hidden");

    forgotContainer.classList.remove("hidden");

    mainButton.textContent =
      "Login";

    switchText.textContent =
      "Don't have an account?";

    switchButton.textContent =
      "Create Account";

  }

}


/* =====================================================
   6. EMAIL LOGIN / SIGNUP
===================================================== */

async function submitEmailAuth() {

  clearMessage();


  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if (!email) {

    showMessage(
      "Please enter your email."
    );

    return;

  }


  if (!password) {

    showMessage(
      "Please enter your password."
    );

    return;

  }


  if (password.length < 6) {

    showMessage(
      "Password must contain at least 6 characters."
    );

    return;

  }


  if (signupMode) {

    await createAccount(
      email,
      password
    );

  } else {

    await login(
      email,
      password
    );

  }

}


/* =====================================================
   7. CREATE ACCOUNT
===================================================== */

async function createAccount(
  email,
  password
) {

  const name =
    nameInput.value.trim();


  if (!name) {

    showMessage(
      "Please enter your name."
    );

    return;

  }


  setLoading(
    true,
    "Creating Account..."
  );


  try {

    const {
      data,
      error
    } = await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {

        data: {
          full_name: name
        }

      }

    });


    if (error) {

      throw error;

    }


    /*
      Email confirmation ON:
      session will be null.
    */

    if (!data.session) {

      showMessage(
        "Account created! Check your email and verify your account.",
        "success"
      );

      setLoading(
        false,
        "Create Account"
      );

      return;

    }


    redirectToDashboard();

  }

  catch (error) {

    console.error(error);

    showMessage(
      readableError(error.message)
    );

  }

  finally {

    mainButton.disabled = false;

  }

}


/* =====================================================
   8. LOGIN
===================================================== */

async function login(
  email,
  password
) {

  setLoading(
    true,
    "Logging in..."
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


    if (error) {

      throw error;

    }


    if (!data.session) {

      throw new Error(
        "Login session could not be created."
      );

    }


    redirectToDashboard();

  }

  catch (error) {

    console.error(error);

    showMessage(
      readableError(error.message)
    );

  }

  finally {

    mainButton.disabled = false;

    if (!signupMode) {

      mainButton.textContent =
        "Login";

    }

  }

}


/* =====================================================
   9. GOOGLE LOGIN
===================================================== */

async function googleLogin() {

  clearMessage();


  const redirectURL =
    window.location.origin +
    window.location.pathname;


  try {

    const {
      error
    } =
      await supabaseClient.auth
        .signInWithOAuth({

          provider: "google",

          options: {

            redirectTo: redirectURL

          }

        });


    if (error) {

      throw error;

    }

  }

  catch (error) {

    console.error(error);

    showMessage(
      readableError(error.message)
    );

  }

}


/* =====================================================
   10. FORGOT PASSWORD
===================================================== */

async function forgotPassword() {

  clearMessage();


  const email =
    emailInput.value.trim();


  if (!email) {

    showMessage(
      "Enter your email first, then tap Forgot password."
    );

    emailInput.focus();

    return;

  }


  try {

    const resetURL =
      window.location.origin +
      window.location.pathname
        .replace(
          "index.html",
          "reset-password.html"
        );


    const {
      error
    } =
      await supabaseClient.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo: resetURL
          }
        );


    if (error) {

      throw error;

    }


    showMessage(
      "Password reset link has been sent to your email.",
      "success"
    );

  }

  catch (error) {

    console.error(error);

    showMessage(
      readableError(error.message)
    );

  }

}


/* =====================================================
   11. PHONE LOGIN
===================================================== */

function openPhoneLogin() {

  clearMessage();

  document
    .getElementById("authBox")
    .classList.add("hidden");

  document
    .getElementById("divider")
    .classList.add("hidden");

  document
    .getElementById("googleButton")
    .classList.add("hidden");

  document
    .getElementById("phoneButton")
    .classList.add("hidden");

  document
    .getElementById("phoneBox")
    .classList.remove("hidden");


  title.textContent =
    "Phone Login";

  subtitle.textContent =
    "Login using OTP";

}


function closePhoneLogin() {

  document
    .getElementById("phoneBox")
    .classList.add("hidden");

  document
    .getElementById("authBox")
    .classList.remove("hidden");

  document
    .getElementById("divider")
    .classList.remove("hidden");

  document
    .getElementById("googleButton")
    .classList.remove("hidden");

  document
    .getElementById("phoneButton")
    .classList.remove("hidden");


  title.textContent =
    signupMode
      ? "Create Account"
      : "Welcome";

  subtitle.textContent =
    signupMode
      ? "Create your Milgaya account"
      : "Login to your Milgaya account";

}


/* =====================================================
   12. SEND OTP
===================================================== */

async function sendOTP() {

  clearMessage();


  let phone =
    document
      .getElementById("phone")
      .value.trim();


  if (/^[6-9][0-9]{9}$/.test(phone)) {

    phone =
      "+91" + phone;

  }


  if (!/^\+[1-9][0-9]{7,14}$/.test(phone)) {

    showMessage(
      "Enter a valid phone number."
    );

    return;

  }


  const button =
    document.getElementById(
      "sendOtpButton"
    );


  button.disabled = true;

  button.textContent =
    "Sending OTP...";


  try {

    const {
      error
    } =
      await supabaseClient.auth
        .signInWithOtp({

          phone: phone

        });


    if (error) {

      throw error;

    }


    document
      .getElementById("otpBox")
      .classList.remove("hidden");


    showMessage(
      "OTP sent successfully.",
      "success"
    );

  }

  catch (error) {

    console.error(error);

    showMessage(
      readableError(error.message)
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "Send OTP";

  }

}


/* =====================================================
   13. VERIFY OTP
===================================================== */

async function verifyOTP() {

  clearMessage();


  let phone =
    document
      .getElementById("phone")
      .value.trim();

  const otp =
    document
      .getElementById("otp")
      .value.trim();


  if (/^[6-9][0-9]{9}$/.test(phone)) {

    phone =
      "+91" + phone;

  }


  if (!/^\d{6}$/.test(otp)) {

    showMessage(
      "Enter the 6-digit OTP."
    );

    return;

  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .verifyOtp({

          phone: phone,

          token: otp,

          type: "sms"

        });


    if (error) {

      throw error;

    }


    if (data.session) {

      redirectToDashboard();

    }

  }

  catch (error) {

    console.error(error);

    showMessage(
      readableError(error.message)
    );

  }

}


/* =====================================================
   14. REDIRECT
===================================================== */

function redirectToDashboard() {

  window.location.replace(
    "dashboard.html"
  );

}


/* =====================================================
   15. LOADING
===================================================== */

function setLoading(
  loading,
  text
) {

  mainButton.disabled =
    loading;

  mainButton.textContent =
    text;

}


/* =====================================================
   16. ERROR MESSAGES
===================================================== */

function readableError(error) {

  if (!error) {

    return "Something went wrong.";

  }


  const e =
    error.toLowerCase();


  if (
    e.includes("invalid login credentials")
  ) {

    return "Email or password is incorrect.";

  }


  if (
    e.includes("user already registered")
  ) {

    return "This email is already registered. Please login.";

  }


  if (
    e.includes("email not confirmed")
  ) {

    return "Please verify your email before logging in.";

  }


  if (
    e.includes("password should be at least")
  ) {

    return "Password must be at least 6 characters.";

  }


  if (
    e.includes("redirect")
  ) {

    return "Redirect URL is not configured correctly in Supabase.";

  }


  return error;

}


/* =====================================================
   17. CHECK EXISTING SESSION
===================================================== */

async function checkExistingSession() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (error) {

    console.error(error);

    return;

  }


  if (data.session) {

    redirectToDashboard();

  }

}


/* =====================================================
   18. AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (
      event === "SIGNED_IN" &&
      session
    ) {

      redirectToDashboard();

    }

  }
);


/* =====================================================
   START
===================================================== */

checkExistingSession();

</script>

</body>
</html>
