<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Milgaya - Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background:
        radial-gradient(circle at top left, #dbeafe, transparent 35%),
        radial-gradient(circle at bottom right, #fef3c7, transparent 35%),
        #f8fafc;
    }

    .glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- LOGO -->
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl
        bg-black text-white text-2xl font-bold shadow-xl mb-4">
        M
      </div>

      <h1 class="text-3xl font-extrabold text-gray-900">
        Milgaya
      </h1>

      <p class="text-gray-500 mt-2">
        Smart QR Lost & Found
      </p>
    </div>


    <!-- AUTH CARD -->
    <div class="glass rounded-3xl shadow-2xl border border-white p-7">

      <!-- LOGIN / SIGNUP TABS -->
      <div class="flex bg-gray-100 rounded-xl p-1 mb-7">

        <button
          id="loginTab"
          onclick="showLogin()"
          class="w-1/2 py-2.5 rounded-lg bg-white shadow font-semibold text-gray-900">
          Login
        </button>

        <button
          id="signupTab"
          onclick="showSignup()"
          class="w-1/2 py-2.5 rounded-lg font-semibold text-gray-500">
          Sign Up
        </button>

      </div>


      <!-- LOGIN FORM -->
      <div id="loginForm">

        <h2 class="text-2xl font-bold text-gray-900 mb-1">
          Welcome back 👋
        </h2>

        <p class="text-gray-500 text-sm mb-6">
          Login to your Milgaya account
        </p>


        <label class="text-sm font-semibold text-gray-700">
          Email
        </label>

        <input
          id="loginEmail"
          type="email"
          placeholder="you@example.com"
          class="w-full mt-2 mb-4 px-4 py-3 rounded-xl border border-gray-200
          outline-none focus:ring-2 focus:ring-black"
        />


        <label class="text-sm font-semibold text-gray-700">
          Password
        </label>

        <input
          id="loginPassword"
          type="password"
          placeholder="••••••••"
          class="w-full mt-2 px-4 py-3 rounded-xl border border-gray-200
          outline-none focus:ring-2 focus:ring-black"
        />


        <div class="text-right mt-2 mb-5">
          <button
            onclick="forgotPassword()"
            class="text-sm font-semibold text-blue-600 hover:underline">
            Forgot Password?
          </button>
        </div>


        <button
          onclick="loginUser()"
          id="loginButton"
          class="w-full bg-black text-white py-3.5 rounded-xl
          font-bold hover:bg-gray-800 transition">
          Login
        </button>

      </div>


      <!-- SIGN UP FORM -->
      <div id="signupForm" class="hidden">

        <h2 class="text-2xl font-bold text-gray-900 mb-1">
          Create account 🚀
        </h2>

        <p class="text-gray-500 text-sm mb-6">
          Create your Milgaya account
        </p>


        <label class="text-sm font-semibold text-gray-700">
          Full Name
        </label>

        <input
          id="signupName"
          type="text"
          placeholder="Your name"
          class="w-full mt-2 mb-4 px-4 py-3 rounded-xl border border-gray-200
          outline-none focus:ring-2 focus:ring-black"
        />


        <label class="text-sm font-semibold text-gray-700">
          Email
        </label>

        <input
          id="signupEmail"
          type="email"
          placeholder="you@example.com"
          class="w-full mt-2 mb-4 px-4 py-3 rounded-xl border border-gray-200
          outline-none focus:ring-2 focus:ring-black"
        />


        <label class="text-sm font-semibold text-gray-700">
          Password
        </label>

        <input
          id="signupPassword"
          type="password"
          placeholder="Minimum 6 characters"
          class="w-full mt-2 mb-4 px-4 py-3 rounded-xl border border-gray-200
          outline-none focus:ring-2 focus:ring-black"
        />


        <label class="text-sm font-semibold text-gray-700">
          Confirm Password
        </label>

        <input
          id="signupConfirmPassword"
          type="password"
          placeholder="Repeat password"
          class="w-full mt-2 mb-5 px-4 py-3 rounded-xl border border-gray-200
          outline-none focus:ring-2 focus:ring-black"
        />


        <button
          onclick="signupUser()"
          id="signupButton"
          class="w-full bg-black text-white py-3.5 rounded-xl
          font-bold hover:bg-gray-800 transition">
          Create Account
        </button>

      </div>


      <!-- MESSAGE -->
      <div
        id="message"
        class="hidden mt-5 p-3 rounded-xl text-sm text-center">
      </div>

    </div>


    <!-- FOOTER -->
    <p class="text-center text-gray-400 text-xs mt-6">
      © 2026 Milgaya. Smart Lost & Found.
    </p>

  </div>


<script>

  // =====================================================
  // SUPABASE CONFIG
  // =====================================================

  const SUPABASE_URL = "YOUR_SUPABASE_URL";

  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";


  const { createClient } = supabase;

  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // =====================================================
  // UI
  // =====================================================

  function showMessage(message, type = "success") {

    const box = document.getElementById("message");

    box.innerText = message;

    box.classList.remove(
      "hidden",
      "bg-green-100",
      "text-green-700",
      "bg-red-100",
      "text-red-700"
    );

    if (type === "success") {

      box.classList.add(
        "bg-green-100",
        "text-green-700"
      );

    } else {

      box.classList.add(
        "bg-red-100",
        "text-red-700"
      );

    }

  }


  function showLogin() {

    document
      .getElementById("loginForm")
      .classList.remove("hidden");

    document
      .getElementById("signupForm")
      .classList.add("hidden");


    document
      .getElementById("loginTab")
      .classList.add("bg-white", "shadow", "text-gray-900");

    document
      .getElementById("loginTab")
      .classList.remove("text-gray-500");


    document
      .getElementById("signupTab")
      .classList.remove("bg-white", "shadow", "text-gray-900");

    document
      .getElementById("signupTab")
      .classList.add("text-gray-500");

  }


  function showSignup() {

    document
      .getElementById("signupForm")
      .classList.remove("hidden");

    document
      .getElementById("loginForm")
      .classList.add("hidden");


    document
      .getElementById("signupTab")
      .classList.add("bg-white", "shadow", "text-gray-900");

    document
      .getElementById("signupTab")
      .classList.remove("text-gray-500");


    document
      .getElementById("loginTab")
      .classList.remove("bg-white", "shadow", "text-gray-900");

    document
      .getElementById("loginTab")
      .classList.add("text-gray-500");

  }


  // =====================================================
  // SIGN UP
  // =====================================================

  async function signupUser() {

    const name =
      document.getElementById("signupName").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("signupConfirmPassword").value;


    if (!name || !email || !password || !confirmPassword) {

      showMessage(
        "Please fill all fields.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("signupButton");

    button.disabled = true;
    button.innerText = "Creating Account...";


    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            full_name: name
          },

          emailRedirectTo:
            window.location.origin

        }

      });


    button.disabled = false;
    button.innerText = "Create Account";


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "Account created! Check your email to verify your account.",
      "success"
    );

  }


  // =====================================================
  // LOGIN
  // =====================================================

  async function loginUser() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "Please enter email and password.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("loginButton");

    button.disabled = true;
    button.innerText = "Logging in...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    button.disabled = false;
    button.innerText = "Login";


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "Login successful!",
      "success"
    );


    // Dashboard ke liye
    setTimeout(() => {

      window.location.href =
        "dashboard.html";

    }, 800);

  }


  // =====================================================
  // FORGOT PASSWORD
  // =====================================================

  async function forgotPassword() {

    const email =
      document.getElementById("loginEmail").value.trim();


    if (!email) {

      showMessage(
        "First enter your email address.",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(

        email,

        {
          redirectTo:
            window.location.origin +
            "/reset-password.html"
        }

      );


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "Password reset link sent to your email.",
      "success"
    );

  }


  // =====================================================
  // CHECK EXISTING LOGIN
  // =====================================================

  async function checkUser() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      window.location.href =
        "dashboard.html";

    }

  }


  checkUser();

</script>

</body>
</html>
