<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApniFind - Lost & Found Smart Tag</title>
    <!-- Tailwind CSS for Beautiful UI -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 flex flex-col min-h-screen justify-center items-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-gray-100 text-center">
        <!-- Logo / Header -->
        <h1 class="text-3xl font-black text-indigo-600 tracking-tight">ApniFind 🔍</h1>
        <p class="text-gray-500 text-sm mt-1">स्मार्ट लॉस्ट एंड फाउंड नेटवर्क</p>
        
        <div class="my-6 border-b border-gray-100"></div>

        <!-- यह सेक्शन तब दिखेगा जब कोई QR स्कैन करेगा -->
        <div id="finder-section">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                💼
            </div>
            <h2 class="text-xl font-bold mb-2 text-gray-800">क्या आपको यह सामान मिला है?</h2>
            <p class="text-gray-600 text-sm mb-6 px-4">यह सामान किसी का गुम हो गया है। कृपया नीचे दिए बटन पर क्लिक करके सीधे मालिक को सुरक्षित संदेश भेजें।</p>
            
            <!-- WhatsApp API Redirect Button -->
            <button onclick="contactOwner()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition duration-200 flex items-center justify-center gap-2">
                💬 मालिक से व्हाट्सएप पर बात करें
            </button>
        </div>

        <!-- यह सेक्शन मालिक के लिए टैग एक्टिवेट करने का है (भविष्य के लिए) -->
        <div id="owner-setup-section" class="hidden mt-4">
            <h2 class="text-lg font-bold mb-2">अपना स्मार्ट टैग एक्टिवेट करें</h2>
            <input type="text" id="owner-name" placeholder="आपका नाम" class="w-full p-3 border border-gray-200 rounded-xl mb-3 focus:outline-indigo-500">
            <input type="tel" id="owner-phone" placeholder="WhatsApp नंबर (With Country Code e.g. 919876543210)" class="w-full p-3 border border-gray-200 rounded-xl mb-4 focus:outline-indigo-500">
            <button onclick="saveOwnerDetails()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl">टैग एक्टिवेट करें</button>
        </div>

        <div class="mt-6 text-xs text-gray-400">
            Tag ID: <span id="tag-id" class="font-mono font-bold text-gray-600">लोड हो रहा है...</span>
        </div>
    </div>

    <script>
        // 1. URL से यूनिक Tag ID निकालना (e.g., ://website.com)
        const urlParams = new URLSearchParams(window.location.search);
        let tagId = urlParams.get('id');
        
        if (!tagId) {
            // अगर कोई ID नहीं है तो टेस्टिंग के लिए एक रैंडम ID दे देते हैं
            tagId = "DEMO-" + Math.floor(1000 + Math.random() * 9000);
        }
        document.getElementById('tag-id').innerText = tagId;

        // 2. डेमो डेटाबेस (शुरुआत के लिए हम हार्डकोडेड नंबर रख रहे हैं)
        // जब आप लाइव करेंगे, तो यहाँ आपका असली नंबर होगा जहाँ अलर्ट जाएगा
        const OWNER_WHATSAPP = "91XXXXXXXXXX"; // <-- यहाँ अपना कंट्री कोड के साथ व्हाट्सएप नंबर डालें (बिना + के, जैसे 91987654321)

        function contactOwner() {
            // ढूंढने वाले के फोन से सीधे मालिक को जाने वाला ऑटोमैटिक मैसेज
            const textMessage = `नमस्ते, मुझे आपका एक सामान मिला है जिसका ApniFind Tag ID [ ${tagId} ] है। कृपया मुझसे यहाँ संपर्क करें।`;
            const whatsappUrl = `https://wa.me{OWNER_WHATSAPP}?text=${encodeURIComponent(textMessage)}`;
            
            // व्हाट्सएप पर रीडायरेक्ट करना
            window.location.href = whatsappUrl;
        }
    </script>
</body>
</html>
